name: Test and deploy GAIA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run test:http
      - name: Diagnose public curriculum URLs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://marzione00.github.io/Gaia_UNION/"
          for path in index.html src/app.js content/catalogue.json content/curriculum/index.json content/curriculum/bundle.json content/curriculum/math-c01.json content/curriculum/paths.json; do
            printf 'LIVE_PROBE path=%s ' "$path"
            curl -L --silent --show-error --max-time 40 -o /tmp/gaia-url-check -w 'status=%{http_code} bytes=%{size_download} type=%{content_type} target=%{url_effective}\\n' "${SITE_URL}$path" || true
            if [ "$path" = 'content/curriculum/bundle.json' ]; then
              printf 'LIVE_PROBE_BUNDLE_PREFIX='
              head -c 70 /tmp/gaia-url-check | tr '\\r\\n' ' ' || true
              printf '\\n'
            fi
          done
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gaia-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be enabled once in Settings > Pages > GitHub Actions.
      # This job has the Pages permissions required by configure-pages.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for path in index.html src/app.js src/scene/worker.js content/catalogue.json assets/glyph-atlas.png assets/scenes/manifest.json LICENSE LICENSE.md THIRD_PARTY_NOTICES.md; do
            curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 \
              "${SITE_URL%/}/$path" --output /dev/null
          done
          printf 'Sito verificato: %s\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
